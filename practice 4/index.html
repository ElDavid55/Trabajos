<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="mystyle.css">
    
    <title>Form</title>
</head>
<body>
    <header>
        <h1>Form</h1>
    </header>
    <main>
        <div class="nombre-contenedor">
            <input type="text"id="nombre" placeholder="Ingresa tu nombre">
        </div>
        <small id="Errornombre" class="alerta-nombre"></small>

        <div class="correo-contenedor">
            <input type="email" id="correo" placeholder="Ingresa tu correo electronico">
        </div>
        <small id="Errorcorreo"class="alerta-correo"></small>

        <div class="numero-contenedor">
            <input type="tel" id="numero" placeholder="Ingresa tu numero de telefono">

        </div>
        <small id="Errornumero" class="alert-numero"></small>

        <div>
            <button id="Ingresar">Ingresar</button>
        </div>
    </main>
    <section>
        <ul id="taskList">
            
        </ul>
    </section>

    <script src="script.js" ></script>

    
</body>
</html>
